name: ecommerce_attack_copy_program_audit
type: attack
schema: ecommerce
description: >
  Diagnostic template inspecting COPY TO PROGRAM privilege boundaries and execution rights.
  (Functional exploit payloads omitted per security policy).
delay_seconds:
  min: 0.1
  max: 0.4
commands:
  - "SELECT rolname, rolsuper, rolcreaterole FROM pg_roles WHERE rolname = CURRENT_USER;"
  - "SELECT pg_has_role(CURRENT_USER, 'pg_execute_server_program', 'USAGE');"
  - "SELECT table_name, table_type FROM information_schema.tables WHERE table_schema = 'public';"

