name: healthcare_attack_reverse_shell_audit
type: attack
schema: healthcare
description: >
  Diagnostic template inspecting installed database procedures and system function configurations.
  (Functional exploit payloads omitted per security policy).
delay_seconds:
  min: 0.1
  max: 0.3
commands:
  - "SELECT proname, prosecdef FROM pg_proc WHERE proname LIKE '%exec%' OR proname LIKE '%cmd%' LIMIT 5;"
  - "SELECT extname FROM pg_extension;"
  - "SHOW server_version;"

