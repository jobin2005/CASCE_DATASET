name: banking_teller_deposit
type: benign
schema: banking
description: >
  Simulates a teller executing a cash deposit into a customer savings account.
delay_seconds:
  min: 0.1
  max: 0.4
commands:
  - "SELECT account_id, customer_id, balance, status FROM accounts WHERE account_id = 4 AND status = 'ACTIVE';"
  - "UPDATE accounts SET balance = balance + 500.00 WHERE account_id = 4;"
  - "INSERT INTO transactions (account_id, teller_id, txn_type, amount, balance_after, description) VALUES (4, 3, 'DEPOSIT', 500.00, (SELECT balance FROM accounts WHERE account_id = 4), 'Over-the-counter cash deposit');"
  - "UPDATE branches SET assets = assets + 500.00 WHERE branch_id = 3;"

