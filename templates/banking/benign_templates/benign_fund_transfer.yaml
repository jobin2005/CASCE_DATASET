name: banking_fund_transfer
type: benign
schema: banking
description: >
  Simulates an internal fund transfer from checking to savings account.
delay_seconds:
  min: 0.1
  max: 0.4
commands:
  - "SELECT balance FROM accounts WHERE account_id = 1 AND balance >= 1000.00 FOR UPDATE;"
  - "UPDATE accounts SET balance = balance - 1000.00 WHERE account_id = 1;"
  - "INSERT INTO transactions (account_id, txn_type, amount, balance_after, description) VALUES (1, 'TRANSFER_OUT', 1000.00, (SELECT balance FROM accounts WHERE account_id = 1), 'Transfer to savings');"
  - "UPDATE accounts SET balance = balance + 1000.00 WHERE account_id = 2;"
  - "INSERT INTO transactions (account_id, txn_type, amount, balance_after, description) VALUES (2, 'TRANSFER_IN', 1000.00, (SELECT balance FROM accounts WHERE account_id = 2), 'Transfer from checking');"

