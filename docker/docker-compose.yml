version: "3.8"

services:
  casce_environment:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: casce_environment
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: postgres
      PGHOST: localhost
      PGPORT: 5432
    ports:
      - "5432:5432"
    # Share host PID namespace so Postgres backend PIDs match eBPF Kernel PIDs
    pid: "host"
    # Privileged is required to load eBPF programs via bpf() syscall and attach tracepoints
    privileged: true
    cap_add:
      - SYS_ADMIN
      - BPF
      - PERFMON
      - SYSLOG
    volumes:
      # eBPF requires access to kernel headers, debugfs, and bpf fs
      - /sys/kernel/debug:/sys/kernel/debug:rw
      - /sys/fs/bpf:/sys/fs/bpf:rw
      - /lib/modules:/lib/modules:ro
      - /usr/src:/usr/src:ro
      - /etc/os-release:/etc/os-release:ro
      # Mount the project workspace
      - ..:/dataset_workspace
