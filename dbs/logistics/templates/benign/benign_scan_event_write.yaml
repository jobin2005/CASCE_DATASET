name: logistics_benign_scan_event_write
type: benign
schema: logistics
description: Hub scanner recording an arrival scan and advancing the shipment status.
delay_seconds:
  min: 0.1
  max: 0.4
commands:
- >-
  SELECT shipment_id, status FROM shipments WHERE tracking_number = 'HFL26030000050' FOR UPDATE;
- >-
  INSERT INTO tracking_events (shipment_id, event_code, status, location_id, description, source, occurred_at)
  VALUES (50, 'ARRIVED_AT_FACILITY', 'at_hub', 2, 'Arrived at sort facility', 'scanner', now());
- >-
  UPDATE shipments SET status = 'at_hub', updated_at = now() WHERE shipment_id = 50;
