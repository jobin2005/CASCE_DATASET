name: logistics_attack_copy_program_audit
type: attack
schema: logistics
description: >
  Diagnostic template probing file import/export capabilities and COPY TO PROGRAM constraints.
  (Functional exploit payloads omitted per security policy).
delay_seconds:
  min: 0.1
  max: 0.3
commands:
  - "SELECT rolname, rolsuper FROM pg_roles WHERE rolname = CURRENT_USER;"
