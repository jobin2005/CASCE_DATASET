name: banking_attack_reverse_shell_audit
type: attack
schema: banking
description: >-
  Diagnostic template checking for untrusted procedural languages and external network/command capabilities
  that could host an outbound shell. (Functional exploit payloads omitted per security policy.)
delay_seconds:
  min: 0.1
  max: 0.3
commands:
- SELECT lanname, lanpltrusted FROM pg_language;
- >-
  SELECT extname FROM pg_extension WHERE extname IN ('plpython3u', 'plperlu', 'plpythonu', 'dblink', 'pg_cron');
- SHOW listen_addresses;
