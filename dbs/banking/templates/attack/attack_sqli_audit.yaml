name: banking_attack_sqli_audit
type: attack
schema: banking
description: >-
  Diagnostic template evaluating input validation against the 'accounts' lookup endpoint: column enumeration,
  a tautology probe, and a comment-terminated probe. Probes land on a harmless SELECT. (Functional exploit
  payloads omitted per security policy.)
delay_seconds:
  min: 0.1
  max: 0.3
commands:
- >-
  SELECT column_name, data_type FROM information_schema.columns WHERE table_name = 'accounts';
- >-
  SELECT account_id, status FROM accounts WHERE account_number = 'DE00 0000 0000 0001' OR '1'='1';
- >-
  SELECT account_id, status FROM accounts WHERE account_number = 'DE00 0000 0000 0001' OR 1=1 -- ' AND
  active = 1
- SELECT current_database(), version();
