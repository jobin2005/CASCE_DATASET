name: banking_benign_balance_inquiry
type: benign
schema: banking
description: Customer checking account balances and recent ledger activity.
delay_seconds:
  min: 0.1
  max: 0.3
commands:
- >-
  SELECT a.account_id, a.account_number, p.category, a.ledger_balance, a.available_balance, a.status FROM
  accounts a JOIN account_products p ON p.product_id = a.product_id JOIN account_holders h ON h.account_id
  = a.account_id WHERE h.customer_id = 1;
- >-
  SELECT e.entry_id, e.direction, e.amount, e.balance_after, e.created_at FROM ledger_entries e WHERE
  e.account_id = 1 ORDER BY e.created_at DESC LIMIT 5;
- >-
  SELECT b.name, b.city FROM branches b JOIN accounts a ON b.branch_id = a.branch_id WHERE a.account_id
  = 1;
