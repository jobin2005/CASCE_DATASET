name: ecommerce_attack_reverse_shell_audit
type: attack
schema: ecommerce
description: >
  Diagnostic template inspecting installed extensions, external communication surfaces, and dblink presence.
  (Functional exploit payloads omitted per security policy).
delay_seconds:
  min: 0.1
  max: 0.3
commands:
  - "SELECT extname, extversion FROM pg_extension;"
  - "SELECT proname, prosrc FROM pg_proc WHERE proname LIKE '%socket%' OR proname LIKE '%connect%' LIMIT 5;"
  - "SHOW shared_preload_libraries;"

