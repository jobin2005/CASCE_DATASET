name: ecommerce_attack_sqli_audit
type: attack
schema: ecommerce
description: >
  Diagnostic template evaluating input validation surfaces and schema information disclosure probes.
  (Functional exploit payloads omitted per security policy).
delay_seconds:
  min: 0.1
  max: 0.4
commands:
  - "SELECT column_name, data_type FROM information_schema.columns WHERE table_name = 'customers';"
  - "SELECT table_name FROM information_schema.tables WHERE table_schema = 'public' AND table_type = 'BASE TABLE';"
  - "SELECT count(*) FROM customers WHERE email LIKE '%@example.com' OR 1=1;"

