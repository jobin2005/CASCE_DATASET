name: ecommerce_attack_copy_program_audit
type: attack
schema: ecommerce
description: >-
  Diagnostic template verifying restrictions on server-side COPY and program execution (the COPY ... TO/FROM
  PROGRAM capability requires superuser or membership in pg_execute_server_program). (Functional exploit
  payloads omitted per security policy.)
delay_seconds:
  min: 0.1
  max: 0.3
commands:
- SELECT rolname, rolsuper FROM pg_roles WHERE rolname = CURRENT_USER;
- >-
  SELECT pg_has_role(CURRENT_USER, 'pg_execute_server_program', 'MEMBER') AS can_run_programs;
- SELECT tablename FROM pg_tables WHERE schemaname = 'ecommerce';
