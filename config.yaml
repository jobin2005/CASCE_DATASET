# CASCE v2 dataset generation configuration
runs_per_template: 5
dev_test_split: 0.7   # fraction of runs going to dataset_dev vs dataset_test

databases:
  - ecommerce
  - banking
  - healthcare
  - logistics

output:
  dev_dir: output/dataset_dev
  test_dir: output/dataset_test

capture:
  kernel_tracer: capture/kernel_ebpf_tracer.py
  postgres_listener: capture/postgres_event_listener.py

postgres:
  host: localhost
  port: 5432
  user: postgres
  password: password
